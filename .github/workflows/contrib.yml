name: Refresh 3D contribution graph

on:
  schedule:
    - cron: "23 4 * * *"   # daily, 04:23 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["assets/contrib.gen.py"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet fonttools brotli
      - name: Render graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 assets/contrib.gen.py assets MansurPro
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-3d.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution graph"
          git push
